<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>InterviewMate — Answer Window</title>
<style>
:root{color-scheme:dark;font-family:Inter,Segoe UI,system-ui,sans-serif;background:#0d1119;color:#edf2ff}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(155deg,#131b2a,#0d1119 48%);min-height:100vh}
header{display:flex;align-items:center;justify-content:space-between;padding:15px 17px;border-bottom:1px solid #273247;background:#101725}
.brand{font-size:13px;font-weight:750;letter-spacing:.3px}.status{font-size:10px;color:#8de3bd;border:1px solid #2a5948;border-radius:99px;padding:4px 8px}
main{padding:16px;display:flex;flex-direction:column;gap:12px}
.label{font-size:10px;letter-spacing:1.2px;text-transform:uppercase;color:#92a3bf;font-weight:700;margin-bottom:8px}
.card{background:#151e2d;border:1px solid #29364b;border-radius:12px;padding:13px}
#question{font-size:13px;line-height:1.5;color:#c4d1e7;white-space:pre-wrap;max-height:100px;overflow:auto}
#answer{font-size:14px;line-height:1.6;white-space:pre-wrap;overflow:auto;max-height:calc(100vh - 270px)}
footer{padding:10px 16px 14px;color:#7f91ad;font-size:10px;display:flex;justify-content:space-between;gap:10px}
button{border:1px solid #34435c;border-radius:8px;background:#1b273a;color:#dbe7ff;padding:7px 10px;font-size:11px;cursor:pointer}
</style>
</head>
<body>
<header><div class="brand">◉ InterviewMate <span style="color:#8ca7ff">/ ANSWER WINDOW</span></div><span class="status">VISIBLE SESSION</span></header>
<main>
  <section class="card"><div class="label">Latest detected question</div><div id="question">Start a session in InterviewMate to show the question here.</div></section>
  <section class="card"><div class="label">Suggested answer</div><div id="answer">Answers generated by your configured local model will appear here.</div></section>
</main>
<footer><span id="updated">Waiting for an answer</span><button id="copy">Copy answer</button></footer>
<script>
let currentAnswer='';
if (window.interviewMateDesktop) {
  window.interviewMateDesktop.onAnswerUpdate((payload) => {
    document.getElementById('question').textContent = payload.question || 'Waiting for a detected question…';
    document.getElementById('answer').textContent = payload.answer || 'Generating or waiting for an answer…';
    document.getElementById('updated').textContent = payload.updatedAt ? 'Updated ' + payload.updatedAt : 'Waiting for an answer';
    currentAnswer = payload.answer || '';
  });
}
document.getElementById('copy').addEventListener('click', async () => {
  try { await navigator.clipboard.writeText(currentAnswer); document.getElementById('updated').textContent = 'Answer copied'; } catch { document.getElementById('updated').textContent = 'Copy unavailable'; }
});
</script>
</body>
</html>
